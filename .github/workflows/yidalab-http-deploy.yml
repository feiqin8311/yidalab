# Emergency deploy when GitHub-hosted runners cannot SSH to prod:22
# (cloud SG often allows :3010 and blocks overseas :22).
# Daily path remains: YidaLab Production Image (build + SSH stream).
name: YidaLab HTTP Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GHCR tag to deploy
        required: true
        default: prod

permissions:
  packages: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          REF="${IMAGE}:${TAG}"
          echo "pull $REF"
          docker pull "$REF"
          docker image inspect "$REF" --format 'id={{.Id}} created={{.Created}} size={{.Size}}'
          echo "REF=$REF" >> "$GITHUB_ENV"

      - name: Save image archive
        env:
          REF: ${{ env.REF }}
        run: |
          set -euo pipefail
          TGZ="$RUNNER_TEMP/yidalab-prod.tgz"
          docker save "$REF" | gzip -1 > "$TGZ"
          ls -lh "$TGZ"
          echo "ARCHIVE=$TGZ" >> "$GITHUB_ENV"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: yidalab-prod-image
          path: ${{ runner.temp }}/yidalab-prod.tgz
          retention-days: 1
          compression-level: 0
