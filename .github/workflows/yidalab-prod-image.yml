# Build linux/amd64 production image and push to GHCR.
# Server then: docker pull + tag yidalab:v1 + compose up (minutes, no compile).
#
# First-time:
#   1. GitHub → Settings → Actions → General → Workflow permissions: Read and write
#   2. After first push, Packages → yidalab → Package settings → connect to repo
#   3. Server login: echo $GHCR_TOKEN | docker login ghcr.io -u USER --password-stdin
#      (PAT need read:packages; or use fine-grained token)
#
# Trigger: manual, or push to main / codex/yidalab-custom
name: YidaLab Production Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag (optional, in addition to sha/latest)
        required: false
        default: ''
  push:
    branches:
      - main
      - codex/yidalab-custom
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'changelog/**'
      - 'e2e/**'
      - '.agents/**'

concurrency:
  group: yidalab-prod-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # ghcr.io/owner/repo (lowercase required by GHCR)
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build linux/amd64 → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/yidalab-custom' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=prod

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub-hosted runners are overseas — official npm is fine (CN mirror can be slower there)
          build-args: |
            USE_CN_MIRROR=false
            NEXT_PUBLIC_BASE_PATH=
          cache-from: type=gha,scope=yidalab-prod-amd64
          cache-to: type=gha,mode=max,scope=yidalab-prod-amd64
          provenance: false

      - name: Summary
        run: |
          {
            echo "## YidaLab image pushed"
            echo ""
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
            echo ""
            echo "Server deploy:"
            echo "\`\`\`bash"
            echo "export GHCR_IMAGE=ghcr.io/${{ github.repository }}"
            echo "export TAG=prod   # or sha-XXXX / latest"
            echo "cd /yida/yidalab && ./server-pull-image.sh"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
