# Build linux/amd64 production image → GHCR, then deploy on the prod self-hosted runner.
# GitHub-hosted job only builds. Prod runner docker-pulls GHCR locally (no US→CN SSH stream).
#
# First-time:
#   1. GitHub → Settings → Actions → General → Workflow permissions: Read and write
#   2. After first push, Packages → yidalab → Package settings → connect to repo
#   3. Self-hosted runner labeled `yidalab-prod` on the prod host (see scripts/ops/deploy)
#
# Trigger: manual, or push to main / codex/yidalab-custom / feat/cloud-sandbox
name: YidaLab Production Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag (optional, in addition to sha/prod/latest)
        required: false
        default: ''
      skip_deploy:
        description: Skip prod deploy after image push
        type: boolean
        required: false
        default: false
      no_cache:
        description: Ignore docker layer cache to force a full rebuild
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
      - codex/yidalab-custom
      - feat/cloud-sandbox
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'changelog/**'
      - 'e2e/**'
      - '.agents/**'
      - '.claude/**'
      - '.cursor/**'
      - '.codex/**'

concurrency:
  # One build+deploy pipeline per branch; cancel superseded pushes
  group: yidalab-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CACHE_IMAGE: ghcr.io/${{ github.repository }}/buildcache
  LOCAL_TAG: yidalab:v1
  DEPLOY_ROOT: /yida/yidalab

jobs:
  build-and-push:
    name: Build linux/amd64 → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image_ref: ${{ steps.out.outputs.image_ref }}
      short_sha: ${{ steps.out.outputs.short_sha }}
    steps:
      - name: Runner resources
        # ubuntu-latest now ships ~86GB free disk, 16GB RAM and 3GB swap, which the
        # build fits in. Deleting preinstalled SDKs took 1–8 min of disk IO for no gain.
        # Logged so a future runner downsize is visible before a build OOMs.
        run: |
          df -h /
          free -h
          swapon --show

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Hosted runner is discarded after the job; `buildx rm` took up to 7 min.
          cleanup: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/yidalab-custom' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=prod

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        env:
          # Reduce host pressure from concurrent buildkit workers
          BUILDKIT_STEP_LOG_MAX_SIZE: '10485760'
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: ${{ inputs.no_cache == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub-hosted runners are overseas — official npm is fine
          build-args: |
            USE_CN_MIRROR=false
            NEXT_PUBLIC_BASE_PATH=
            NEXT_PUBLIC_ENABLE_CLOUD_SANDBOX=1
          # Inline cache only. Registry buildcache repeatedly hung this monorepo build
          # (60–90m stuck on "Build and push" with no log export). ignore-error kept.
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
          provenance: false

      - name: Export image ref
        id: out
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_ref=${IMAGE}:prod" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## YidaLab image pushed"
            echo ""
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Deploy job runs next (unless skip_deploy)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy → prod server
    needs: build-and-push
    if: >
      always() &&
      needs.build-and-push.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true)
    runs-on: [self-hosted, yidalab-prod]
    timeout-minutes: 40
    steps:
      # No actions/checkout or docker/login-action: prod host cannot reliably
      # reach github.com:443. The apply script lives on the runner box.
      - name: Pull image and restart
        env:
          REF: ${{ needs.build-and-push.outputs.image_ref }}
          LOCAL_TAG: ${{ env.LOCAL_TAG }}
          DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF=$(echo "$REF" | tr '[:upper:]' '[:lower:]')
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          echo "pull $REF"
          # The prod host's link to GHCR's blob CDN sometimes stalls at "Pulling fs layer"
          # with zero progress, and docker pull never times out on its own. A healthy pull
          # of the ~345MB layer takes under a minute, so kill stalled attempts and retry.
          pulled=0
          for attempt in 1 2 3 4 5; do
            if timeout --kill-after=10 300 docker pull "$REF"; then
              pulled=1
              break
            fi
            echo "::warning::docker pull attempt ${attempt} failed or stalled; retrying"
            sleep 5
          done
          if [ "$pulled" != 1 ]; then
            echo "::error::docker pull failed after 5 attempts; prod keeps the previous image"
            exit 1
          fi
          docker image inspect "$REF" --format 'id={{.Id}} created={{.Created}} size={{.Size}}'
          /opt/actions-runner/apply-ghcr-image.sh "$REF"

      - name: Summary
        if: always()
        env:
          REF: ${{ needs.build-and-push.outputs.image_ref }}
        run: |
          {
            echo "## Deployed to prod (self-hosted runner)"
            echo ""
            echo "- image: \`${REF}\`"
            echo "- local tag: \`${{ env.LOCAL_TAG }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
